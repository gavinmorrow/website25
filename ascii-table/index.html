<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Table</title>
    <style>
      /* Copied from <https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/table> (2026-09-28) */
      table {
        border-collapse: collapse;
        border: 2px solid rgb(140 140 140);
        font-family: sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      caption {
        /* caption-side: bottom; */
        padding: 10px;
        font-weight: bold;
      }

      thead,
      tfoot {
        background-color: rgb(228 240 245);
      }

      th,
      td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
      }

      td:last-of-type {
        text-align: center;
      }

      tbody > tr:nth-of-type(even) {
        background-color: rgb(237 238 242);
      }

      tfoot th {
        text-align: right;
      }

      tfoot td {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <table id="table">
      <caption>
        ASCII Printable Range
      </caption>
      <thead>
        <tr>
          <th scope="col">Decimal</th>
          <th scope="col">Binary</th>
          <th scope="col">Hex</th>
          <th scope="col">Symbol</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script>
      const table = document.getElementById("table");
      const tbody = table.querySelector("tbody");

      const printableRange = [/* 32 */ 0b00100000, /* 127 */ 0b01111111];
      for (let i = printableRange[0]; i < printableRange[1]; i++) {
        const decimal = i.toString().padStart(3, "0");
        const binary = i.toString(2).padStart(8, "0");
        const hex = i.toString(16).toUpperCase().padStart(2, "0");
        const symbol = String.fromCharCode(i);

        const row = document.createElement("tr");
        row.innerHTML = `<th scope="row">${decimal}</th><td>${binary}</td><td>${hex}</td><td>${symbol}</td>`;
        tbody.appendChild(row);
      }
    </script>
  </body>
</html>
